# 에이전트 배포 워크플로
# Actions 탭 → Agent → Run workflow 로 실행합니다(Release 워크플로와 따로).
#
# 동작 순서
#   1. 마지막 Release(초안·사전 출시 제외)를 찾는다 — 없으면 멈춘다(먼저 Release 워크플로를 돌린다)
#   2. 빌드 기준을 체크아웃한다: 그 Release의 태그(기본, 호스트 앱과 같은 코드) 또는 기본 브랜치(에이전트만 고쳐 다시 배포)
#   3. 참여자 웹을 빌드하고(에이전트 실행 파일에 들어간다) 에이전트를 시험·빌드한다
#   4. 그 Release에 있던 에이전트 첨부 파일(merge-master-agent-*.exe)을 지우고 새로 올린다(같은 Release에 여러 번 돌리면 갈아 끼운다)
#
# 첨부 파일: merge-master-agent-<버전>.exe (설치 없이 실행, 창 없이 트레이에서 돈다. 에이전트 PC에 Excel이 있으면 마감 때 그 PC에서 저장한다)
#
# 필요한 시크릿
#   RELEASE_TOKEN (선택) : 기본 토큰으로 Release 첨부를 바꿀 수 없을 때만 등록
#   추가로 필요한 시크릿 없음

name: Agent

on:
  workflow_dispatch:
    inputs:
      source:
        description: "빌드 기준 (release-tag: 마지막 Release의 태그 코드, default-branch: 기본 브랜치의 지금 코드)"
        required: true
        type: choice
        options:
          - release-tag
          - default-branch
        default: release-tag

permissions:
  contents: write

# 같은 Release의 첨부를 동시에 바꾸지 않도록 한 번에 하나씩만 실행
concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  agent:
    name: Agent
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      APP_NAME: ${{ github.event.repository.name }}

    steps:
      # ───────── 1. 마지막 Release 찾기 ─────────
      - name: "1. 마지막 Release 찾기"
        run: |
          set -euo pipefail
          # gh release view(태그 없이)는 'Latest'로 표시된 Release를 돌려준다(초안·사전 출시 제외).
          if ! TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null) || [ -z "$TAG" ]; then
            echo "::error::Release가 없습니다. 먼저 Release 워크플로로 Release를 만든 뒤 다시 실행하세요."
            exit 1
          fi
          echo "마지막 Release: ${TAG}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          if [ "${{ inputs.source }}" = "default-branch" ]; then
            echo "REF=${DEFAULT_BRANCH}" >> "$GITHUB_ENV"
          else
            echo "REF=refs/tags/${TAG}" >> "$GITHUB_ENV"
          fi

      # ───────── 2. 체크아웃 ─────────
      - name: "2. 저장소 체크아웃"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: "2-1. 에이전트가 있는 코드인지 확인"
        run: |
          set -euo pipefail
          if [ ! -f crates/collect-agent/Cargo.toml ]; then
            echo "::error::${REF}에는 에이전트가 없습니다(에이전트가 들어가기 전에 만든 Release). 빌드 기준을 default-branch로 다시 실행하거나, 새 Release를 만든 뒤 실행하세요."
            exit 1
          fi

      # ───────── 3. 빌드 ─────────
      - name: pnpm 설정
        uses: pnpm/action-setup@v4 # package.json의 packageManager(pnpm 버전)를 따른다

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Rust 설정
        uses: dtolnay/rust-toolchain@stable

      # Cargo 작업 공간 루트의 target/을 캐시한다(Release 워크플로와 같은 캐시를 쓰지 않게 키를 나눈다)
      - name: Rust 빌드 캐시
        uses: swatinem/rust-cache@v2
        with:
          key: agent

      - name: 의존성 설치
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: "3-1. 참여자 웹 빌드"
        run: |
          set -euo pipefail
          # 참여자 웹은 collect-server에 들어간다(rust-embed, allow_missing).
          # 먼저 빌드하지 않아도 에이전트는 만들어지지만 참여자 화면이 빠지므로 반드시 먼저 빌드하고 확인한다.
          pnpm build:participant
          if [ ! -f apps/participant/dist/index.html ]; then
            echo "::error::참여자 웹 빌드 결과(apps/participant/dist/index.html)가 없습니다."
            exit 1
          fi

      - name: "3-2. 에이전트 시험"
        run: |
          set -euo pipefail
          cargo test --locked -p agent-protocol --features client -p collect-agent

      - name: "3-3. 에이전트 빌드"
        run: |
          set -euo pipefail
          cargo build --locked --release -p collect-agent
          EXE=target/release/merge-master-agent.exe
          if [ ! -f "$EXE" ]; then
            echo "::error::실행 파일(${EXE})을 찾지 못했습니다."
            exit 1
          fi
          VERSION=$(node scripts/version.mjs)
          if [ "v${VERSION}" != "${TAG}" ] && [ "${VERSION}" != "${TAG}" ]; then
            echo "::warning::빌드한 코드의 버전(${VERSION})이 Release(${TAG})와 다릅니다. 호스트 앱과 관리 API 판이 같은지 확인하세요."
          fi
          mkdir -p agent-assets
          ASSET="agent-assets/${APP_NAME}-agent-${VERSION}.exe"
          cp "$EXE" "$ASSET"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"
          ls -la agent-assets

      # ───────── 4. Release 첨부 갈아 끼우기 ─────────
      - name: "4. Release에 에이전트 첨부(같은 이름의 앞 첨부는 지운다)"
        run: |
          set -euo pipefail
          # 이 Release에 있던 에이전트 첨부를 모두 지운다(버전이 달라 이름이 다른 것도).
          OLD=$(gh release view "$TAG" --json assets --jq '.assets[].name' \
                  | grep -E "^${APP_NAME}-agent-.*\.exe$" || true)
          for name in $OLD; do
            echo "앞 첨부 지움: ${name}"
            gh release delete-asset "$TAG" "$name" --yes
          done
          gh release upload "$TAG" "$ASSET" --clobber
          {
            echo "### 🛰️ 에이전트 배포 완료"
            echo "- Release: ${TAG} (빌드 기준: ${{ inputs.source }}, $(git rev-parse --short HEAD))"
            echo "- 첨부: $(basename "$ASSET")"
            echo "https://github.com/${GH_REPO}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
