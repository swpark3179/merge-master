[package]
name = "collect-agent"
description = "에이전트: 다른 PC에서 창 없이(트레이) 취합 서비스를 맡아, 마감이 되면 엑셀로 저장하고 끝낸다"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "merge-master-agent"
path = "src/main.rs"

[dependencies]
agent-protocol.workspace = true
axum.workspace = true
chrono.workspace = true
collect-core.workspace = true
collect-server.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
collect-excel.workspace = true
excel-com.workspace = true
rfd = "0.16"
tao = "0.37"
tray-icon = "0.25"
winreg = "0.56"
# IP 명단 창(WebView2). 호스트 앱(Tauri)과 같은 판.
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Threading",
] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
agent-protocol = { workspace = true, features = ["client"] }
collect-store.workspace = true
futures-util = "0.3"
tokio-tungstenite = "0.30"
