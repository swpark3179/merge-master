[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
edition = "2024"
version = "2.0.0"
license = "UNLICENSED"

[workspace.dependencies]
agent-protocol = { path = "crates/agent-protocol" }
collect-agent = { path = "crates/collect-agent" }
collect-core = { path = "crates/collect-core" }
collect-excel = { path = "crates/collect-excel" }
collect-server = { path = "crates/collect-server" }
collect-store = { path = "crates/collect-store" }
excel-com = { path = "crates/excel-com" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
if-addrs = "0.15"
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }

[profile.release]
codegen-units = 1
lto = "thin"
